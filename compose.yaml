name: corpo-knowledge
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: corpo
      POSTGRES_USER: corpo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run npm run setup first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpo -d corpo"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: corpo
      PGUSER: corpo
      PGPASSWORD: ${DB_PASSWORD:?Run npm run setup first}
      SESSION_SECRET: ${SESSION_SECRET:?Run npm run setup first}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run npm run setup first}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      OPENWEBUI_URL: ${OPENWEBUI_URL:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  postgres_data:
